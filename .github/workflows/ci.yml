name: Backend checks

on:
    push:
        branches: ["**"]

    pull_request:
        branches: ["**"]

defaults:
    run:
        working-directory: ./back

jobs:
    test:
        name: Run tests
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Install uv
              uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

            - name: Install deps
              run: uv sync --locked --all-extras --dev

            - name: Run ruff check
              run: uv run ruff check

            - name: Check formatting
              run: uv run ruff format --check .

            - name: Run unit and integration tests
              working-directory: .
              run: make run-test

            - name: Stop test services
              if: always()
              working-directory: .
              run: docker compose -f infrastructure/back/docker-compose.test.yml down --remove-orphans
