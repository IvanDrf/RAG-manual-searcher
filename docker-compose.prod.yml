version: '3.9'

services:
  database:
    image: postgres:17.10
    container_name: rag_searcher_postgresql
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_OUTPUT_PORT}:5432"
    volumes: 
      - pgdata:/var/lib/postgresql/data

    networks:
    - rag_search_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
      
  redis_db:
    image: redis:8.6
    container_name: rag_searcher_redis
    restart: always
    ports:
      - "${REDIS_OUTPUT_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - rag_search_network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  prometheus:
    image: prom/prometheus:v3
    container_name: rag_searcher_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml 
    ports:
      - "${PROMETHEUS_PORT}:9090"
    networks:
      - rag_search_network

  grafana:
    image: grafana/grafana:nightly-slim
    container_name: rag_searcher_grafana
    environment:
      - "GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}"
      - "GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    ports:
      - "${GRAFANA_PORT}:3000"

    networks:
      - rag_search_network

  rag_searcher_app:
    container_name: rag_searcher_app
    build: .
    ports:
      - "${APP_OUTPUT_PORT}:8080"
    depends_on:
      redis_db:
        condition: service_healthy
      database:
        condition: service_healthy

    networks:
      - rag_search_network

networks:
  rag_search_network:
    name: rag_search_network
    driver: bridge


volumes:
  pgdata:
  redis_data:
  grafana-storage:
