repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: local
    hooks:
      - id: backend-tests
        name: Backend unit and integration tests
        entry: make run-test
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-commit]
