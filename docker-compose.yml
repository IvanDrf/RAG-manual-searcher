version: '3.8'

services:
  database:
    image: postgres:17.10
    container_name: rag_search_pstgresql_db
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_OUTPUT_PORT}:5432"
    volumes: 
      - pgdata:/var/lib/postgresql/data

    networks:
    - rag_search_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


networks:
  rag_search_network:
    name: rag_search_network
    driver: bridge


volumes:
  pgdata:
