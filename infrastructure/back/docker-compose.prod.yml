version: '3.8'

services:
  database:
    image: pgvector/pgvector:pg17-trixie
    container_name: rag_search_postgresql_vector_prod

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_OUTPUT_PORT}:5432"
    volumes: 
      - pgdata:/var/lib/postgresql/data
      - ../../back/scripts/data:/docker-entrypoint-initdb.d

    networks:
    - rag_search_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
      
  redis_db:
    image: redis:8.6
    container_name: rag_searcher_redis_prod
    ports:
      - "${REDIS_OUTPUT_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - rag_search_network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  clickhouse:
    image: clickhouse:26.6
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: ${CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - rag_search_network
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3
    container_name: rag_searcher_prometheus_prod
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml 
    ports:
      - "${PROMETHEUS_PORT}:9090"
    networks:
      - rag_search_network

  grafana:
    image: grafana/grafana:nightly-slim
    container_name: rag_searcher_grafana_prod
    environment:
      - "GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}"
      - "GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    ports:
      - "${GRAFANA_PORT}:3000"

    networks:
      - rag_search_network

  rag_searcher_app:
    container_name: rag_searcher_app_prod
    build:
      context: ../..
      dockerfile: infrastructure/back/Dockerfile
    env_file:
      - ../../.env
    volumes:
      - type: bind
        source: ${BOOKS_SOURCE_DIR}
        target: ${BOOKS_DIR}
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import os; from urllib.request import urlopen; urlopen('http://127.0.0.1:' + os.environ['APP_PORT'] + '/health', timeout=5).close()"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 15m
    ports:
      - "${APP_OUTPUT_PORT}:${APP_PORT}"
    depends_on:
      redis_db:
        condition: service_healthy
      database:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

    networks:
      - rag_search_network

networks:
  rag_search_network:
    name: rag_search_network
    driver: bridge


volumes:
  pgdata:
  redis_data:
  grafana-storage:
  clickhouse_data:
