[project]
name = "rag-manual-searcher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "begsta", email = "s.begdash@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "beautifulsoup4>=4.15.0",
    "bm25s>=0.3.11",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "nltk>=3.10.3",
    "openrouter>=1.1.139",
    "pandas>=3.0.5",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "pymorphy3>=2.0.6",
    "pystemmer>=3.1.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[tool.ruff]
line-length = 140
exclude = ["alembic"]

[dependency-groups]
dev = ["ipykernel>=7.3.0", "pre-commit>=4.6.2", "ruff>=0.16.6"]
